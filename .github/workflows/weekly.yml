name: weekly refresh

# K-apt 관리비(주 1회 갱신)와 국토교통부 실거래가(월 1회)를 다시 받아
# 사이트를 재생성하고, deploy 브랜치(단일 커밋)로 배포한다.
on:
  schedule:
    - cron: '0 20 * * 0'   # 월요일 05:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch K-apt weekly files
        run: python3 scripts/fetch_kapt.py

      - name: Fetch 실거래가 CSV (실패해도 기존 파일 유지)
        run: python3 scripts/fetch_molit.py
        continue-on-error: true

      - name: Build dataset
        run: python3 scripts/build_data.py

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Validate site
        run: python3 scripts/check_site.py

      - name: Publish to deploy branch (single commit)
        run: |
          set -euo pipefail
          cd site
          git init -q
          git checkout -q -b deploy
          git config user.name "apt-cost-hub"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "site: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('data/processed/dataset.json', encoding='utf-8'))
          n = d['national']; t = d.get('trade') or {}
          print(f"관리비 {d['reference_month']} · 단지 {n['complexes']:,} · 시군구 {n['regions']}")
          print(f"실거래 {t.get('reference_month')} · {t.get('rows', 0):,}건")
          PY
